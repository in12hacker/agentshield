[workspace]
resolver = "2"
members = ["crates/backend/as-main", "crates/backend/as-runtime-config", "crates/contracts/as-types", "crates/contracts/as-kernel-common", "crates/backend/as-policy-engine", "crates/backend/as-driver-adapter", "crates/backend/as-process-tree", "crates/backend/as-credentials", "crates/backend/as-flow", "crates/backend/as-security-log", "crates/middleware/as-middleware"]
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
[workspace.dependencies]
tokio = { version = "=1.53.3", features = ["rt", "sync", "time", "net", "macros"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
futures = "=0.3.32"
async-trait = "=0.1.89"
thiserror = "=2.0.18"
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde-saphyr = "=0.0.27"
arc-swap = "=1.9.1"
zerocopy = { version = "=0.8.50", features = ["derive"] }
tempfile = "=3.27.0"
tracing = "=0.1.44"
globset = "=0.4.18"
regex = "=1.12.3"
ipnet = "=2.12.0"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
serde_json = "=1.0.150"
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
rustix = { version = "=1.1.6", features = ["fs", "time"] }
async-io = "=2.6.0"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "=1.10.1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "=0.1.20", features = ["server-auto", "tokio"] }
http = "=1.5.0"
http-body-util = "=0.1.5"
bytes = "=1.12.1"
rustls-native-certs = "=0.8.3"
rcgen = { version = "=0.13.2", features = ["x509-parser"] }
zeroize = "=1.8.2"
base64 = "=0.22.1"
getrandom = "=0.4.3"
url = "=2.5.8"
time = "=0.3.47"
