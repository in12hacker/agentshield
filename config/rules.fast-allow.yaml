    log: false
- kind: network
  id: linux-fast-allow-local-control
  number: 3
  enabled: true
  execution:
    location: driver
  rules:
  - id: linux-fast-allow-as-control
    number: 1
    enabled: true
    scope:
      kind: all_protected
    operations:
    - connect
    - send
    source: {}
    target:
      remote_cidr: 127.0.0.1/32
      remote_port:
        first: 8765
        last: 8765
      protocol: 6
    action:
      type: allow
    deny_message: ''
    log: false
  - id: linux-fast-allow-gateway-control
    number: 2
    enabled: true
    scope:
      kind: all_protected
    operations:
    - connect
    - send
    source: {}
    target:
      remote_cidr: 127.0.0.1/32
      remote_port:
        first: 18789
        last: 18789
      protocol: 6
    action:
      type: allow
    deny_message: ''
    log: false
  - id: linux-fast-allow-docker-dns
    number: 3
    enabled: true
