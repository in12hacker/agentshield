[package]
name = "as-flow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
as-types = { path = "../../contracts/as-types" }
tokio = { workspace = true, features = ["io-util"] }
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
rustix.workspace = true
sha2.workspace = true
getrandom = "=0.3.4"
bytes = "=1.12.1"
indexmap = "=2.14.2"
http = "=1.5.0"
hyper = { version = "=1.10.1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "=0.1.20", features = ["server-auto", "tokio"] }
http-body-util = "=0.1.5"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.3"
url = "=2.5.8"
flate2 = "=1.1.10"
brotli = "=9.0.0"
[dev-dependencies]
as-credentials = { path = "../as-credentials" }
tempfile.workspace = true
rcgen = "=0.13.2"
